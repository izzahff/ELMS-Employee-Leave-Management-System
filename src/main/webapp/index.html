<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/ELMS_3.0/imnsb_logo.png">
    <title>IMNSB Employee Leave Management System</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
</head>


<body>
    <div class="container">
        <div class="auth-card">
            <div class="logo-container">
                <img src="/ELMS_3.0/imnsb_logo.png" alt="IMNSB Logo" class="logo">
                <div class="logo-text">
                    <h1>Welcome to IMNSB</h1>
                    <p>Employee Leave Management System</p>
                </div>
            </div>
            
            <div class="role-selection">
                <h2>Select your role</h2>
                <div class="role-options">
                   <a href="/ELMS_3.0/Employee/EmployeeLogin.jsp" class="role-btn" data-role="employee">Employee</a>
				   <a href="/ELMS_3.0/Manager/ManagerLogin.jsp" class="role-btn" data-role="manager">Manager</a>
				   <a href="/ELMS_3.0/Admin/AdminLogin.jsp" class="role-btn" data-role="admin">Admin</a>
                </div>
                <p class="info-text">Please select your role to continue</p>
            </div>
        </div>
    </div>
</body>
</html>
